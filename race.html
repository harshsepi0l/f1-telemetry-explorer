<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --bg:#101216; --line:#23262c; --muted:#8b919c; --accent:#ffb44a; }
  * { box-sizing:border-box; }
  body { margin:0; background:transparent; color:#eee; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:2px; text-transform:uppercase; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--accent); }
  .controls { display:flex; gap:8px; align-items:center; margin:10px 0 6px; flex-wrap:wrap; }
  button { background:#17191e; color:#eee; border:1px solid #33363d; border-radius:8px; padding:7px 14px;
           font:600 12px ui-monospace,Menlo,Consolas,monospace; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#111; border-color:var(--accent); }
  button.on { border-color:var(--accent); color:var(--accent); }
  input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  .map { width:100%; height:400px; display:block; overflow:visible; }
  .mapwrap { position:relative; }
  .win { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(0.85); opacity:0;
         transition:opacity .35s ease, transform .45s cubic-bezier(.2,1.5,.4,1); pointer-events:none;
         background:rgba(10,10,12,.9); border:1px solid var(--wc); border-radius:14px; padding:0 0 16px;
         min-width:260px; text-align:center; overflow:hidden; box-shadow:0 0 40px -8px var(--wc); }
  .win.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .win .flag { height:10px; background:repeating-conic-gradient(#f5f5f0 0 25%, #111 0 50%) 0 0 / 10px 10px; margin-bottom:14px; }
  .win .lbl { font-size:11px; color:var(--accent); }
  .win .who { font:800 46px/1.05 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color:var(--wc);
              text-shadow:0 0 18px var(--wc); margin:6px 0 2px; letter-spacing:1px; }
  .win .team { font-size:14px; color:#ddd; }
  .win .meta { font-size:13px; color:var(--muted); margin-top:8px; font-variant-numeric:tabular-nums; }
  .readouts { display:flex; gap:16px; font-size:14px; margin-top:4px; }
  .ro { flex:1; padding-left:10px; border-left:4px solid; }
  .ro .stats { display:flex; gap:18px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .bar { margin-top:6px; height:5px; background:#2b2e34; border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; width:0; }
  .drs { font:700 10px ui-monospace,Menlo,Consolas,monospace; letter-spacing:1px; padding:1px 6px; border-radius:4px;
         border:1px solid #33363d; color:#4a4f58; align-self:center; transition:all .12s; }
  .drs.on { background:#22c55e; border-color:#22c55e; color:#06210f; box-shadow:0 0 8px #22c55e; }
  .tiny { font-size:11px; color:var(--muted); margin-top:2px; }
  .status { font-size:13px; color:var(--muted); margin-top:10px; min-height:18px; }
  .chartwrap { margin-top:14px; position:relative; }
  .tip { position:absolute; pointer-events:none; display:none; z-index:5; min-width:170px;
         background:rgba(10,10,12,.95); border:1px solid #33363d; border-radius:8px; padding:8px 10px;
         font-size:12px; line-height:1.5; font-variant-numeric:tabular-nums; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  .tip .hd { font:600 11px ui-monospace,Menlo,Consolas,monospace; letter-spacing:1px; color:var(--accent); margin-bottom:4px; }
  .tip .row { display:flex; gap:8px; align-items:baseline; }
  .tip .row b { min-width:34px; }
  .chart { width:100%; height:230px; display:block; cursor:crosshair; }
</style></head>
<body>
<div class="card">
  <div class="top mono"><span>Fastest lap</span><span>Monza · <b id="clock">0.0 s</b></span></div>

  <div class="controls">
    <button id="play" class="primary">Play</button>
    <button id="reset">Reset</button>
    <span class="tiny mono" style="margin:0 2px 0 8px;">Speed</span>
    <button class="rate" data-r="1">1x</button>
    <button class="rate on" data-r="2">2x</button>
    <button class="rate" data-r="4">4x</button>
    <input id="scrub" type="range" min="0" step="0.01" value="0">
  </div>

  <div class="mapwrap">
    <svg id="map" class="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <g id="trackLayer"></g><g id="cornerLayer"></g><g id="carLayer"></g>
    </svg>
    <div id="win" class="win">
      <div class="flag"></div>
      <div class="lbl mono" id="winLbl">Winner</div>
      <div class="who" id="winWho"></div>
      <div class="team" id="winTeam"></div>
      <div class="meta" id="winMeta"></div>
    </div>
  </div>

  <div class="readouts" id="readouts"></div>
  <div class="status" id="status"></div>

  <div class="chartwrap">
    <div class="top mono"><span>Speed around the lap</span><span style="color:var(--muted)">hover for details · scroll to zoom · drag to pan · click to jump
      <button id="zoomReset" style="margin-left:8px; padding:3px 8px; visibility:hidden;">Reset zoom</button></span></div>
    <svg id="chart" class="chart" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tip" class="tip"></div>
  </div>
</div>

<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const [VW, VH] = DATA.view;
const CAR_SCALE = 1.5;
const drivers = DATA.drivers;
const maxT = Math.max(...drivers.map(d => d.lap));

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- interpolation ----------
function seg(ts, t) {  // largest i with ts[i] <= t, clamped so i+1 exists
  let lo = 0, hi = ts.length - 2;
  if (t <= ts[0]) return 0;
  if (t >= ts[hi]) return hi;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ts[m] <= t) lo = m; else hi = m - 1; }
  return lo;
}
function lerp(ts, vs, t) {
  const n = ts.length;
  if (t <= ts[0]) return vs[0];
  if (t >= ts[n - 1]) return vs[n - 1];
  const i = seg(ts, t), u = (t - ts[i]) / ((ts[i + 1] - ts[i]) || 1);
  return vs[i] + (vs[i + 1] - vs[i]) * u;
}
function cr(p0, p1, p2, p3, u) {  // Catmull-Rom: smooth curve through the GPS samples
  return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
function posAt(P, t) {
  const ts = P.t, n = ts.length;
  t = Math.min(Math.max(t, ts[0]), ts[n - 1]);
  const i = seg(ts, t), u = (t - ts[i]) / ((ts[i + 1] - ts[i]) || 1);
  const a = Math.max(i - 1, 0), d = Math.min(i + 2, n - 1);
  return [cr(P.x[a], P.x[i], P.x[i + 1], P.x[d], u), cr(P.y[a], P.y[i], P.y[i + 1], P.y[d], u)];
}
function headingAt(P, t) {
  const ts = P.t, end = ts[ts.length - 1];
  let a = t - 0.06, b = t + 0.06;
  if (b > end) { b = end; a = end - 0.12; }
  if (a < ts[0]) { a = ts[0]; b = ts[0] + 0.12; }
  const p = posAt(P, a), q = posAt(P, b);
  return Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI;
}

// ---------- track ----------
const map = document.getElementById("map");
{
  // crop the view to the circuit itself (plus room for labels) so it fills the panel
  const xs = DATA.track.map(p => p[0]), ys = DATA.track.map(p => p[1]), m = 48;
  const x0 = Math.min(...xs) - m, y0 = Math.min(...ys) - m;
  map.setAttribute("viewBox", `${x0} ${y0} ${Math.max(...xs) + m - x0} ${Math.max(...ys) + m - y0}`);
}
const trackLayer = document.getElementById("trackLayer");
const d = "M " + DATA.track.map(p => p[0] + " " + p[1]).join(" L ") + " Z";
el("path", { d, fill: "none", stroke: "#f5f5f0", "stroke-opacity": 0.12, "stroke-width": 19, "stroke-linejoin": "round" }, trackLayer);
el("path", { d, fill: "none", stroke: "#24272d", "stroke-width": 15, "stroke-linejoin": "round" }, trackLayer);
el("path", { d, fill: "none", stroke: "#3a3f48", "stroke-width": 0.8, "stroke-dasharray": "5 7", "stroke-linejoin": "round" }, trackLayer);
// corner numbers from FastF1's circuit info, labeled just off the track
{
  const layer = document.getElementById("cornerLayer");
  (DATA.corners || []).forEach(c => {
    el("line", { x1: c.on[0], y1: c.on[1], x2: c.label[0], y2: c.label[1], stroke: "#5d636d", "stroke-width": 0.6 }, layer);
    el("circle", { cx: c.label[0], cy: c.label[1], r: 6.5, fill: "#17191e", stroke: "#8b919c", "stroke-width": 0.7 }, layer);
    el("text", { x: c.label[0], y: c.label[1] + 2.4, "text-anchor": "middle", "font-size": c.name.length > 2 ? 5.5 : 6.8,
                 "font-weight": 700, "font-family": "Arial, sans-serif", fill: "#d6d9de" }, layer).textContent = c.name;
  });
}

// DRS zones: green tint over the track, an activation line, and a label on the outside
const DRS_GREEN = "#22c55e";
const zones = DATA.drs || [];
{
  const xs = DATA.track.map(p => p[0]), ys = DATA.track.map(p => p[1]);
  const mid = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
  zones.forEach(z => {
    z.paths.forEach(pts => {
      const dz = "M " + pts.map(p => p[0] + " " + p[1]).join(" L ");
      el("path", { d: dz, fill: "none", stroke: DRS_GREEN, "stroke-opacity": 0.18, "stroke-width": 15, "stroke-linejoin": "round" }, trackLayer);
      el("path", { d: dz, fill: "none", stroke: DRS_GREEN, "stroke-width": 1.1, "stroke-dasharray": "2 3", opacity: 0.85 }, trackLayer);
    });
    const pts = z.paths[0], a = pts[0], b = pts[Math.min(4, pts.length - 1)];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    let n = [-(b[1] - a[1]) / len, (b[0] - a[0]) / len];
    if ((a[0] - mid[0]) * n[0] + (a[1] - mid[1]) * n[1] < 0) n = [-n[0], -n[1]];  // point away from the middle
    el("line", { x1: a[0] - n[0] * 8, y1: a[1] - n[1] * 8, x2: a[0] + n[0] * 8, y2: a[1] + n[1] * 8,
                 stroke: DRS_GREEN, "stroke-width": 1.6 }, trackLayer);
    const g = el("g", { transform: `translate(${a[0] + n[0] * 21} ${a[1] + n[1] * 21})` }, trackLayer);
    el("rect", { x: -18, y: -7, width: 36, height: 13, rx: 3, fill: "#0a0a0a", stroke: DRS_GREEN, "stroke-width": 0.8 }, g);
    el("text", { x: 0, y: 2.6, "text-anchor": "middle", "font-size": 8, "font-weight": 700,
                 "font-family": "ui-monospace,Menlo,Consolas,monospace", fill: DRS_GREEN }, g).textContent = "DRS " + z.n;
  });
}
{
  const P0 = drivers[0].pos, s = posAt(P0, P0.t[0]), ang = headingAt(P0, P0.t[0]) + 90;
  const g = el("g", { transform: `translate(${s[0]} ${s[1]}) rotate(${ang})` }, trackLayer);
  el("rect", { x: -8, y: -1.6, width: 16, height: 3.2, fill: "#f5f5f0" }, g);
  for (const [x, y] of [[-8, -1.6], [0, -1.6], [-4, 0], [4, 0]]) el("rect", { x, y, width: 4, height: 1.6, fill: "#111" }, g);
}

// ---------- cars ----------
// Approximate 2025 liveries: body, accent stripes, nose tip, wings.
// The glow and UI accents use the official team color that FastF1 provides.
const LIVERIES = [
  ["red bull",     { body: "#1E3170", accent: "#E8002D", nose: "#FFC906", wing: "#16244E" }],
  ["mclaren",      { body: "#FF8000", accent: "#1A1A1A", nose: "#FF8000", wing: "#1A1A1A" }],
  ["ferrari",      { body: "#DC0000", accent: "#FFFFFF", nose: "#DC0000", wing: "#1A1A1A" }],
  ["mercedes",     { body: "#121212", accent: "#C8CCD0", nose: "#00D7B6", wing: "#121212" }],
  ["aston",        { body: "#00594F", accent: "#CEDC00", nose: "#00594F", wing: "#0C2A26" }],
  ["alpine",       { body: "#0078C1", accent: "#FF87BC", nose: "#FF87BC", wing: "#0A1E3C" }],
  ["williams",     { body: "#0B2A5B", accent: "#00A3E0", nose: "#00A3E0", wing: "#0B2A5B" }],
  ["racing bulls", { body: "#F2F2F2", accent: "#1634CB", nose: "#1634CB", wing: "#1634CB" }],
  ["haas",         { body: "#F2F2F2", accent: "#E6002B", nose: "#F2F2F2", wing: "#1A1A1A" }],
  ["sauber",       { body: "#121212", accent: "#52E252", nose: "#52E252", wing: "#121212" }],
];
function liveryFor(team, color) {
  const t = (team || "").toLowerCase();
  const hit = LIVERIES.find(([key]) => t.includes(key));
  return hit ? hit[1] : { body: color, accent: "#111111", nose: color, wing: "#111111" };
}

function carMarkup(dr) {
  // top-down car centered on (0,0), nose pointing +x
  const L = liveryFor(dr.team, dr.color), glow = dr.color;
  const wheel = `fill="#0a0a0a" stroke="${dr.tire}" stroke-width="0.35"`;
  return `
    <g style="filter:drop-shadow(0 0 3px ${glow})">
      <circle class="tr" cx="-14" cy="0" r="1.4" fill="${glow}" opacity="0.55"/>
      <circle class="tr" cx="-17" cy="0" r="1.15" fill="${glow}" opacity="0.35"/>
      <circle class="tr" cx="-20" cy="0" r="0.95" fill="${glow}" opacity="0.2"/>
      <circle class="tr" cx="-23" cy="0" r="0.75" fill="${glow}" opacity="0.1"/>
      <ellipse cx="0" cy="0" rx="14" ry="5.5" fill="${glow}" opacity="0.15"/>
      <rect x="-9" y="-5" width="4" height="1.8" rx="0.5" ${wheel}/>
      <rect x="-9" y="3.2" width="4" height="1.8" rx="0.5" ${wheel}/>
      <rect x="5" y="-4.7" width="3.4" height="1.5" rx="0.5" ${wheel}/>
      <rect x="5" y="3.2" width="3.4" height="1.5" rx="0.5" ${wheel}/>
      <path d="M-11 -1.6 L-6 -2 L-4 -3.8 Q0 -4.4 3 -3.6 L5 -2 L11 -0.9 Q12.4 0 11 0.9 L5 2 L3 3.6 Q0 4.4 -4 3.8 L-6 2 L-11 1.6 Z"
            fill="${L.body}" stroke="${glow}" stroke-width="0.4" stroke-opacity="0.8"/>
      <path d="M-4 -3.1 Q0 -3.7 3 -3" fill="none" stroke="${L.accent}" stroke-width="0.6" stroke-linecap="round"/>
      <path d="M-4 3.1 Q0 3.7 3 3" fill="none" stroke="${L.accent}" stroke-width="0.6" stroke-linecap="round"/>
      <rect x="-10" y="-0.35" width="6.5" height="0.7" rx="0.3" fill="${L.accent}"/>
      <rect x="3" y="-0.3" width="5" height="0.6" rx="0.3" fill="${L.accent}" opacity="0.9"/>
      <path d="M8 -1.25 L11 -0.9 Q12.4 0 11 0.9 L8 1.25 Z" fill="${L.nose}"/>
      <ellipse cx="0.5" cy="0" rx="2.7" ry="1.35" fill="#0b0d12"/>
      <circle cx="0" cy="0" r="0.9" fill="#f2f2f2"/>
      <rect x="-12.6" y="-3.6" width="1.6" height="7.2" rx="0.4" fill="${L.wing}" stroke="${L.accent}" stroke-width="0.3"/>
      <rect x="11.3" y="-4.4" width="1.3" height="8.8" rx="0.4" fill="${L.wing}" stroke="${L.accent}" stroke-width="0.3"/>
      <rect x="-12.2" y="-0.5" width="0.9" height="1" fill="#ff2a2a"/>
      <rect class="drsfx" x="-13.4" y="-3.6" width="0.8" height="7.2" rx="0.3" fill="${"#22c55e"}"
            style="display:none;filter:drop-shadow(0 0 2px #22c55e)"/>
    </g>`;
}

const carLayer = document.getElementById("carLayer");
const readouts = document.getElementById("readouts");
const cars = drivers.map((dr, k) => {
  const wrap = el("g", {}, carLayer);
  const body = el("g", {}, wrap);
  body.innerHTML = carMarkup(dr);
  const label = el("g", {}, wrap);
  el("rect", { x: -15, y: -8, width: 30, height: 12, rx: 3, fill: "#0a0a0a", stroke: dr.color, "stroke-width": 0.8 }, label);
  const txt = el("text", { x: 0, y: 1.5, "text-anchor": "middle", "font-size": 9, "font-weight": 700,
                           "font-family": "Arial, sans-serif", fill: dr.color }, label);
  txt.textContent = dr.code;

  const ro = document.createElement("div");
  ro.className = "ro";
  ro.style.borderColor = dr.color;
  ro.innerHTML = `
    <div><b style="color:${dr.color};font-size:16px">${dr.code}</b> · ${dr.team}</div>
    <div class="stats"><span><b class="spd">0</b> km/h</span><span>gear <b class="gr">-</b></span><span class="pc">0.0% of lap</span><span class="drs">DRS</span></div>
    <div class="bar"><div style="background:${dr.color};box-shadow:0 0 6px ${dr.color}"></div></div>
    <div class="tiny">throttle</div>`;
  readouts.appendChild(ro);

  return {
    dr, wrap, body, label, trail: [...body.querySelectorAll(".tr")], labelBelow: k === 1, ang: null,
    spd: ro.querySelector(".spd"), gr: ro.querySelector(".gr"), pc: ro.querySelector(".pc"), bar: ro.querySelector(".bar > div"),
    drs: ro.querySelector(".drs"), drsfx: body.querySelector(".drsfx"),
  };
});

// ---------- speed chart ----------
// Zoom: scroll to zoom the lap axis around the cursor, drag to pan, double-click (or Reset zoom) to see the whole lap.
// While zoomed, the speed axis fits whatever stretch of the lap is on screen.
const chart = document.getElementById("chart");
const M = { l: 40, r: 12, t: 10, b: 24 };
let CW = 800, CH = 230, chartDots = [], hoverLine, hoverDots = [];
let vx0 = 0, vx1 = 100, yLo = 0, yHi = 400;
const cx = p => M.l + (p - vx0) / (vx1 - vx0) * (CW - M.l - M.r);
const cy = v => M.t + (1 - (v - yLo) / (yHi - yLo)) * (CH - M.t - M.b);
const inView = p => p >= vx0 && p <= vx1;
const niceStep = (span, target) => [0.5, 1, 2, 5, 10, 20, 25, 50, 100].find(s => span / s <= target) || 100;

function fitY() {
  let lo = Infinity, hi = -Infinity;
  drivers.forEach(dr => dr.tel.pct.forEach((p, i) => {
    if (p >= vx0 - 0.5 && p <= vx1 + 0.5) { lo = Math.min(lo, dr.tel.speed[i]); hi = Math.max(hi, dr.tel.speed[i]); }
  }));
  if (!isFinite(lo)) { lo = 0; hi = 350; }
  const step = niceStep(Math.max(hi - lo, 10), 6);
  yLo = Math.floor((lo - 2) / step) * step; yHi = Math.ceil((hi + 2) / step) * step;
  return step;
}

function drawChart() {
  CW = chart.clientWidth || 800; CH = chart.clientHeight || 230;
  chart.setAttribute("viewBox", `0 0 ${CW} ${CH}`);
  chart.innerHTML = "";
  const ystep = fitY();
  const axis = { fill: "#8b919c", "font-size": 10, "font-family": "ui-monospace,Menlo,Consolas,monospace" };
  const defs = el("defs", {}, chart), clip = el("clipPath", { id: "plotClip" }, defs);
  el("rect", { x: M.l, y: M.t, width: CW - M.l - M.r, height: CH - M.t - M.b }, clip);

  for (let v = yLo; v <= yHi + 1e-9; v += ystep) {
    el("line", { x1: M.l, x2: CW - M.r, y1: cy(v), y2: cy(v), stroke: "#23262c" }, chart);
    el("text", { ...axis, x: M.l - 6, y: cy(v) + 3, "text-anchor": "end" }, chart).textContent = +v.toFixed(1);
  }
  const xstep = niceStep(vx1 - vx0, 8);
  for (let p = Math.ceil(vx0 / xstep) * xstep; p <= vx1 + 1e-9; p += xstep) {
    el("text", { ...axis, x: cx(p), y: CH - 6, "text-anchor": "middle" }, chart).textContent = +p.toFixed(1) + "%";
  }
  el("text", { ...axis, x: M.l, y: M.t + 2, "text-anchor": "start", "dominant-baseline": "hanging", fill: "#5d636d" }, chart).textContent = " km/h";

  const plot = el("g", { "clip-path": "url(#plotClip)" }, chart);
  (DATA.corners || []).forEach(c => {
    el("line", { x1: cx(c.pct), x2: cx(c.pct), y1: M.t, y2: CH - M.b, stroke: "#5d636d", "stroke-opacity": 0.35, "stroke-dasharray": "1 3" }, plot);
    el("text", { ...axis, x: cx(c.pct), y: CH - M.b - 4, "text-anchor": "middle", fill: "#6b717b", "font-size": 9 }, plot).textContent = "T" + c.name;
  });
  zones.forEach(z => {
    z.pct.forEach(([p0, p1]) => {
      el("rect", { x: cx(p0), y: M.t, width: Math.max(1, cx(p1) - cx(p0)), height: CH - M.t - M.b, fill: DRS_GREEN, opacity: 0.09 }, plot);
    });
    const shown = z.pct.map(([a, b]) => [Math.max(a, vx0), Math.min(b, vx1)]).filter(([a, b]) => b > a);
    if (shown.length) {
      const w = shown.reduce((m, r) => (r[1] - r[0] > m[1] - m[0] ? r : m));
      el("text", { ...axis, x: (cx(w[0]) + cx(w[1])) / 2, y: M.t + 12, "text-anchor": "middle", fill: DRS_GREEN,
                   "font-weight": 700 }, plot).textContent = "DRS " + z.n;
    }
  });
  drivers.forEach(dr => {
    const pts = dr.tel.pct.map((p, i) => [p, i]).filter(([p]) => p >= vx0 - 2 && p <= vx1 + 2)
      .map(([p, i]) => cx(p).toFixed(1) + "," + cy(dr.tel.speed[i]).toFixed(1)).join(" ");
    el("polyline", { points: pts, fill: "none", stroke: dr.color, "stroke-width": 1.6, opacity: 0.85, "stroke-linejoin": "round",
                     ...(dr.dashed ? { "stroke-dasharray": "6 4" } : {}) }, plot);
  });
  chartDots = drivers.map(dr => {
    const guide = el("line", { y1: M.t, y2: CH - M.b, stroke: dr.color, "stroke-opacity": 0.35, "stroke-dasharray": "3 4" }, plot);
    const dot = el("circle", { r: 5.5, fill: dr.color, stroke: "#fff", "stroke-width": 1.5,
                               style: `filter:drop-shadow(0 0 5px ${dr.color})` }, plot);
    return { guide, dot };
  });
  hoverLine = el("line", { y1: M.t, y2: CH - M.b, stroke: "#c9ccd2", "stroke-width": 1, opacity: 0.6, style: "display:none" }, chart);
  hoverDots = drivers.map(dr => el("circle", { r: 4, fill: "#101216", stroke: dr.color, "stroke-width": 2, style: "display:none" }, plot));
  document.getElementById("zoomReset").style.visibility = vx0 > 0 || vx1 < 100 ? "visible" : "hidden";
}

function setView(a, b) {
  const span = Math.min(100, Math.max(2, b - a));  // never zoom in tighter than 2% of the lap
  a = Math.min(Math.max(a, 0), 100 - span);
  vx0 = a; vx1 = a + span;
  drawChart();
}
drawChart();
new ResizeObserver(drawChart).observe(chart);

// ---------- winner banner ----------
const winEl = document.getElementById("win");
const [A, B] = drivers;
const tie = Math.abs(A.lap - B.lap) < 0.0005;
const winner = A.lap <= B.lap ? A : B, loser = winner === A ? B : A;
const fmtLap = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`;
winEl.style.setProperty("--wc", tie ? "#ffb44a" : winner.color);
if (tie) {
  document.getElementById("winLbl").textContent = "Dead heat";
  document.getElementById("winWho").textContent = `${A.code} = ${B.code}`;
  document.getElementById("winMeta").textContent = fmtLap(A.lap);
} else {
  document.getElementById("winWho").textContent = winner.code;
  document.getElementById("winTeam").textContent = winner.team;
  document.getElementById("winMeta").textContent =
    `${fmtLap(winner.lap)}  ·  ${(loser.lap - winner.lap).toFixed(3)} s ahead of ${loser.code}`;
}

// ---------- clock + controls ----------
let t = 0, playing = false, rate = 2, last = null, scrubbing = false;
const playBtn = document.getElementById("play");
const scrub = document.getElementById("scrub");
scrub.max = maxT.toFixed(2);

function snapHeadings() { cars.forEach(c => c.ang = null); }
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; };
document.getElementById("reset").onclick = () => { t = 0; snapHeadings(); };
document.querySelectorAll(".rate").forEach(b => b.onclick = () => {
  rate = +b.dataset.r;
  document.querySelectorAll(".rate").forEach(x => x.classList.toggle("on", x === b));
});
scrub.addEventListener("input", () => { scrubbing = true; t = +scrub.value; snapHeadings(); });
scrub.addEventListener("change", () => { scrubbing = false; });
// hover: crosshair + tooltip with both drivers' telemetry at that point of the lap
const tip = document.getElementById("tip");
const pctFromEvent = e => {
  const r = chart.getBoundingClientRect();
  const u = ((e.clientX - r.left) / r.width * CW - M.l) / (CW - M.l - M.r);
  return Math.min(vx1, Math.max(vx0, vx0 + u * (vx1 - vx0)));
};
function hideHover() {
  tip.style.display = "none"; hoverLine.style.display = "none";
  hoverDots.forEach(d => d.style.display = "none");
}
function showHover(e) {
  const p = pctFromEvent(e), X = cx(p);
  hoverLine.setAttribute("x1", X); hoverLine.setAttribute("x2", X); hoverLine.style.display = "";
  const rows = drivers.map((dr, i) => {
    const T = dr.tel, k = Math.min(seg(T.pct, p) + 1, T.pct.length - 1);
    const spd = lerp(T.pct, T.speed, p), thr = lerp(T.pct, T.throttle, p);
    hoverDots[i].setAttribute("cx", X); hoverDots[i].setAttribute("cy", cy(spd)); hoverDots[i].style.display = "";
    const drs = T.drs.length && T.drs[k] === 1 ? ` · <span style="color:${DRS_GREEN}">DRS</span>` : "";
    return `<div class="row"><b style="color:${dr.color}">${dr.code}</b><span><b style="color:#eee">${spd.toFixed(0)}</b> km/h · ` +
           `${thr.toFixed(0)}% thr · gear ${T.gear[k]}${drs}</span></div>`;
  });
  const near = (DATA.corners || []).reduce((best, c) => (Math.abs(c.pct - p) < Math.abs((best || { pct: 1e9 }).pct - p) ? c : best), null);
  const turn = near && Math.abs(near.pct - p) < Math.max(0.4, (vx1 - vx0) * 0.015) ? ` · T${near.name}` : "";
  const zone = zones.find(z => z.pct.some(([a, b]) => p >= a && p <= b));
  tip.innerHTML = `<div class="hd">${p.toFixed(1)}% of lap${turn}${zone ? " · DRS " + zone.n : ""}</div>` + rows.join("");
  tip.style.display = "block";
  const wrap = tip.parentElement.getBoundingClientRect(), cr = chart.getBoundingClientRect();
  let left = e.clientX - wrap.left + 14;
  if (left + tip.offsetWidth > wrap.width) left = e.clientX - wrap.left - tip.offsetWidth - 14;
  tip.style.left = left + "px";
  tip.style.top = (cr.top - wrap.top + 8) + "px";
}

let drag = null;  // { x, v0, v1, moved }
chart.addEventListener("mousedown", e => { drag = { x: e.clientX, v0: vx0, v1: vx1, moved: false }; });
window.addEventListener("mouseup", () => { if (drag && drag.moved) chart.style.cursor = "crosshair"; });
chart.addEventListener("mousemove", e => {
  if (drag && e.buttons === 1) {
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 3) drag.moved = true;
    if (drag.moved && (drag.v0 > 0 || drag.v1 < 100)) {
      chart.style.cursor = "grabbing";
      const r = chart.getBoundingClientRect();
      const dp = dx / r.width * CW / (CW - M.l - M.r) * (drag.v1 - drag.v0);
      setView(drag.v0 - dp, drag.v1 - dp);
      hideHover();
      return;
    }
  }
  showHover(e);
});
chart.addEventListener("mouseleave", () => { hideHover(); });
chart.addEventListener("wheel", e => {
  e.preventDefault();
  const p = pctFromEvent(e), f = Math.exp(e.deltaY * 0.0015);
  setView(p - (p - vx0) * f, p + (vx1 - p) * f);
  showHover(e);
}, { passive: false });
chart.addEventListener("dblclick", () => setView(0, 100));
document.getElementById("zoomReset").onclick = () => setView(0, 100);
chart.addEventListener("click", e => {
  // jump the clock to when driver 1 reached that point of the lap (not after a drag)
  if (drag && drag.moved) { drag = null; return; }
  drag = null;
  t = lerp(drivers[0].tel.pct, drivers[0].tel.t, pctFromEvent(e));
  snapHeadings();
});

// ---------- render ----------
function render(dt) {
  const states = cars.map(c => {
    const dr = c.dr, T = dr.tel;
    const tc = Math.min(t, dr.lap);
    const moving = t > 0 && t < dr.lap;
    const [x, y] = posAt(dr.pos, tc);

    // ease the heading toward its target so corners look smooth, not twitchy
    const target = headingAt(dr.pos, tc);
    if (c.ang === null) c.ang = target;
    else {
      const diff = ((target - c.ang + 540) % 360) - 180;
      c.ang += diff * Math.min(1, dt * 14);
    }

    const pct = lerp(T.t, T.pct, tc);
    const speed = lerp(T.t, T.speed, tc);
    const throttle = lerp(T.t, T.throttle, tc);
    const gear = T.gear[Math.min(seg(T.t, tc) + 1, T.gear.length - 1)];

    c.body.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${c.ang.toFixed(2)}) scale(${CAR_SCALE})`);
    // labels sit off to one side of the car (driver 1 left, driver 2 right), whichever way it's facing
    const r = c.ang * Math.PI / 180, side = c.labelBelow ? 1 : -1;
    const lx = x - Math.sin(r) * side * 24, ly = y + Math.cos(r) * side * 24 + 2;
    c.label.setAttribute("transform", `translate(${lx.toFixed(2)} ${ly.toFixed(2)})`);
    const gap = 2.5 + speed / 350 * 4;
    c.trail.forEach((dot, i) => {
      dot.setAttribute("cx", (-14 - i * gap).toFixed(2));
      dot.style.display = moving ? "" : "none";
    });

    c.spd.textContent = speed.toFixed(0);
    c.gr.textContent = gear;
    const drsOpen = moving && T.drs.length > 0 && T.drs[Math.min(seg(T.t, tc) + 1, T.drs.length - 1)] === 1;
    c.drs.classList.toggle("on", drsOpen);
    c.drsfx.style.display = drsOpen ? "" : "none";
    c.pc.textContent = pct.toFixed(1) + "% of lap";
    c.bar.style.width = throttle.toFixed(0) + "%";
    return { pct, speed };
  });

  // leader drawn last so it sits on top
  const order = states[0].pct >= states[1].pct ? [1, 0] : [0, 1];
  if (carLayer.lastChild !== cars[order[1]].wrap) order.forEach(i => carLayer.appendChild(cars[i].wrap));

  chartDots.forEach((cd, i) => {
    const vis = inView(states[i].pct) ? "" : "none";
    cd.dot.style.display = vis; cd.guide.style.display = vis;
    const X = cx(states[i].pct), Y = cy(states[i].speed);
    cd.dot.setAttribute("cx", X.toFixed(1)); cd.dot.setAttribute("cy", Y.toFixed(1));
    cd.guide.setAttribute("x1", X.toFixed(1)); cd.guide.setAttribute("x2", X.toFixed(1));
  });

  document.getElementById("clock").textContent = Math.min(t, maxT).toFixed(1) + " s";
  if (!scrubbing) scrub.value = Math.min(t, maxT).toFixed(2);

  const [a, b] = drivers;
  let msg;
  if (t >= Math.min(a.lap, b.lap)) {
    const w = a.lap <= b.lap ? a : b;
    msg = `${w.code} finishes this lap first (+${Math.abs(a.lap - b.lap).toFixed(3)} s)`;
  } else if (states[0].pct > states[1].pct + 0.2) msg = `${a.code} is ahead (${states[0].pct.toFixed(1)}% vs ${states[1].pct.toFixed(1)}%)`;
  else if (states[1].pct > states[0].pct + 0.2) msg = `${b.code} is ahead (${states[1].pct.toFixed(1)}% vs ${states[0].pct.toFixed(1)}%)`;
  else msg = "Side by side";
  document.getElementById("status").textContent = msg;
  winEl.classList.toggle("show", t >= winner.lap);
}

function frame(now) {
  if (last === null) last = now;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (playing) {
    t += dt * rate;
    if (t > maxT + 3.0 * rate) { t = 0; snapHeadings(); }  // hold ~3s on the result, then replay
  }
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
